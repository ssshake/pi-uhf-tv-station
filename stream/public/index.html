<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pi TV Viewer</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			min-height: 100vh;
			background: #0a0a0a;
			color: #e8e8e8;
			font-family: system-ui, -apple-system, sans-serif;
			display: flex;
			flex-direction: column;
		}

		header {
			padding: 1rem 1.25rem 0.5rem;
			border-bottom: 1px solid #222;
		}

		h1 {
			font-size: 1.1rem;
			font-weight: 600;
			letter-spacing: 0.04em;
			text-transform: uppercase;
			color: #888;
		}

		.status {
			margin-top: 0.35rem;
			font-size: 0.95rem;
			min-height: 1.4em;
		}

		.status.paused {
			color: #f0a020;
		}

		.status.offline {
			color: #c44;
		}

		.status.buffering {
			color: #888;
		}

		.layout {
			flex: 1;
			display: flex;
			min-height: 0;
		}

		.viewer-panel {
			flex: 1;
			min-width: 0;
			display: flex;
			flex-direction: column;
			padding: 0.75rem 1.25rem 1.25rem;
		}

		.remote-panel {
			width: 420px;
			flex-shrink: 0;
			border-left: 1px solid #222;
			background: #111;
			display: flex;
			flex-direction: column;
		}

		.remote-panel h2 {
			padding: 0.75rem 1rem;
			font-size: 0.75rem;
			font-weight: 600;
			letter-spacing: 0.06em;
			text-transform: uppercase;
			color: #666;
			border-bottom: 1px solid #222;
		}

		.remote-panel iframe {
			flex: 1;
			width: 100%;
			border: 0;
			background: #0a0a0a;
		}

		.video-wrap {
			position: relative;
			width: 100%;
			flex: 1;
			min-height: 0;
			background: #000;
			border: 2px solid #222;
			border-radius: 4px;
			overflow: hidden;
		}

		video {
			width: 100%;
			height: 100%;
			display: block;
			background: #000;
			object-fit: contain;
		}

		@media (max-width: 900px) {
			.layout {
				flex-direction: column;
			}

			.remote-panel {
				width: 100%;
				height: 520px;
				border-left: 0;
				border-top: 1px solid #222;
			}

			.video-wrap {
				aspect-ratio: 4 / 3;
				flex: none;
			}
		}
	</style>
</head>
<body>
	<header>
		<h1>Pi TV Viewer</h1>
		<div id="status" class="status">Connecting…</div>
	</header>

	<main class="layout">
		<section class="viewer-panel">
			<div class="video-wrap">
				<video id="player" controls autoplay muted playsinline></video>
			</div>
		</section>

		<aside class="remote-panel">
			<h2>Remote</h2>
			<iframe
				src="http://10.0.0.22:8080/"
				title="Pi TV Remote"
				allow="autoplay"
			></iframe>
		</aside>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
	<script>
		const apiUrl = `http://${window.location.hostname}:3000`;

		const player = document.getElementById('player');
		const statusEl = document.getElementById('status');
		let hls = null;
		let activeSessionId = null;
		let attaching = false;

		const setStatus = (text, className = 'status') => {
			statusEl.textContent = text;
			statusEl.className = className;
		};

		const detachStream = () => {
			if (hls) {
				hls.destroy();
				hls = null;
			}
			player.removeAttribute('src');
			player.load();
		};

		const waitForPlaylist = async (url, attempts = 40) => {
			for (let i = 0; i < attempts; i++) {
				try {
					const response = await fetch(url, { cache: 'no-store' });
					if (response.ok) {
						const text = await response.text();
						if (text.includes('#EXTM3U') && text.includes('#EXTINF')) {
							return true;
						}
					}
				} catch (err) {
					// stream not ready yet
				}
				await new Promise((resolve) => setTimeout(resolve, 500));
			}
			return false;
		};

		const attachStream = async (sessionId) => {
			if (attaching || sessionId === activeSessionId) {
				return;
			}

			attaching = true;
			detachStream();

			const playlistUrl = `/hls/stream.m3u8?v=${sessionId}`;
			setStatus('Buffering…', 'status buffering');

			const ready = await waitForPlaylist(playlistUrl);
			if (!ready) {
				setStatus('Waiting for stream…', 'status offline');
				attaching = false;
				return;
			}

			if (Hls.isSupported()) {
				hls = new Hls({
					enableWorker: true,
					lowLatencyMode: false,
					liveSyncDurationCount: 3,
					maxBufferLength: 20,
					maxMaxBufferLength: 40,
					backBufferLength: 0,
					startFragPrefetch: true,
				});

				hls.loadSource(playlistUrl);
				hls.attachMedia(player);

				hls.on(Hls.Events.MANIFEST_PARSED, () => {
					activeSessionId = sessionId;
					attaching = false;
					player.play().catch(() => {});
				});

				hls.on(Hls.Events.ERROR, (_, data) => {
					if (!data.fatal) {
						return;
					}

					attaching = false;
					if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
						hls.recoverMediaError();
						return;
					}

					setStatus('Stream error — retrying…', 'status offline');
					activeSessionId = null;
					detachStream();
				});
			} else if (player.canPlayType('application/vnd.apple.mpegurl')) {
				player.src = playlistUrl;
				player.addEventListener('loadedmetadata', () => {
					activeSessionId = sessionId;
					attaching = false;
					player.play().catch(() => {});
				}, { once: true });
			} else {
				attaching = false;
				setStatus('HLS not supported in this browser', 'status offline');
			}
		};

		const refreshStatus = () => {
			fetch(`${apiUrl}/nowplaying`, { cache: 'no-store' })
				.then((response) => response.json())
				.then((data) => {
					if (!data.powerState) {
						setStatus('Transmitter offline', 'status offline');
						player.pause();
						return;
					}

					if (!data.playing) {
						setStatus(
							data.nowPlaying ? `Paused — ${data.nowPlaying}` : 'Paused',
							'status paused'
						);
						player.pause();
						return;
					}

					setStatus(data.nowPlaying || 'Live');

					return fetch('/status', { cache: 'no-store' })
						.then((response) => response.json())
						.then((stream) => {
							if (!stream.sessionId || stream.sessionId === activeSessionId) {
								if (stream.sessionId === activeSessionId && player.paused) {
									player.play().catch(() => {});
								}
								return;
							}

							attachStream(stream.sessionId);
						});
				})
				.catch(() => {
					setStatus('Cannot reach Pi TV API', 'status offline');
				});
		};

		refreshStatus();
		setInterval(refreshStatus, 2000);
	</script>
</body>
</html>
